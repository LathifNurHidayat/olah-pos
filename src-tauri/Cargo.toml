[package]
name = "olahpos"
version = "0.1.0"
description = "OlahPOS - Desktop Point of Sale & Inventory Management"
authors = ["OlahPOS Team"]
license = "Proprietary"
edition = "2021"

[lib]
name = "olahpos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
rusqlite = { version = "0.33", features = ["bundled", "chrono"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
libdbus-sys = { version = "0.2", features = ["vendored"] }
